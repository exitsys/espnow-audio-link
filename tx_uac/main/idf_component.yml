## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: '>=4.1.0'
  # # Put list of dependencies here
  # # For components maintained by Espressif:
  # component: "~1.0.0"
  # # For 3rd party components:
  # username/component: ">=1.0.0,<2.0.0"
  # username2/component2:
  #   version: "~1.0.0"
  #   # For transient dependencies `public` flag can be set.
  #   # `public` flag doesn't have an effect dependencies of the `main` component.
  #   # All dependencies of `main` are public by default.
  #   public: true
  ## 打补丁的本地副本（只读走 FIFO 半满线以上的数据、水位线按帧长对齐、
  ## 数据端点改成 synchronous 且不带反馈端点）。
  ## 改动清单见根目录 NOTICE.md，文件内改动处都标了「本工程补丁」。
  ## 若要回退到上游原版：删掉下面 override_path 一行，重新构建时组件管理器会从
  ## 组件仓库下载 espressif/usb_device_uac（version "*" 取最新，不保证还是 1.3.2）。
  espressif/usb_device_uac:
    version: "*"
    override_path: "../components/usb_device_uac"
  ## 锁文件（dependencies.lock）不入库：组件管理器会把本地组件的绝对路径写进去，
  ## 每台机器构建一次它都变，入库就会带着本机路径。原先由锁文件钉住的两个传递依赖，
  ## 在这里钉成同一个版本（2026-11-26 之前实际用的就是这两个）。
  espressif/tinyusb:
    version: "0.19.0~3"
  espressif/cmake_utilities:
    version: "1.4.1"
